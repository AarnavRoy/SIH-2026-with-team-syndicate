<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft 3D Layered Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: sans-serif;
        }

        /* 1. Background Grid */
        .background-grid {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, #888888 1px, transparent 1px),
                linear-gradient(to bottom, #888888 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.4;
            transform: rotate(-10deg);
            z-index: 1;
        }

        /* Torn Paper Top Left */
        .torn-paper {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 150px;
            height: 120px;
            background: #ffffff;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            z-index: 2;
        }

        /* 2. Outer Card Container */
        .outer-card {
            position: relative;
            z-index: 3;
            width: 340px;
            height: 500px;
            background: linear-gradient(to bottom, #d6dbe0 0%, #ebdcd6 100%);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        /* 3. Inner Card (Bevel Effect) */
        .inner-card {
            width: 100%;
            height: 100%;
            background-color: #f4eee7;
            border-radius: 16px;
            /* Thick semi-transparent white border for bevel */
            border: 6px solid rgba(255, 255, 255, 0.8);
            /* Inner shadow for 3D depth and outer subtle shadow for separation */
            box-shadow: 
                inset 4px 4px 10px rgba(0, 0, 0, 0.04),
                inset -4px -4px 10px rgba(255, 255, 255, 0.6),
                0 6px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden; /* Contains the ribbon */
            box-sizing: border-box;
            padding: 24px;
        }

        /* 4. Typography */
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #4a4541;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 2;
        }

        /* 5. Decorative Graphics */
        .ribbon-svg {
            position: absolute;
            top: 45%;
            left: -10%;
            width: 120%;
            height: auto;
            transform: rotate(-12deg) translateY(-50%);
            opacity: 0.85;
            z-index: 1;
        }

        .loop-line-svg {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 85%;
            height: auto;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Tilted Grid Background -->
    <div class="background-grid"></div>

    <!-- Torn Paper Blob -->
    <div class="torn-paper"></div>

    <!-- Outer Card -->
    <div class="outer-card">
        <!-- Inner Card -->
        <div class="inner-card">
            
            <!-- Typography -->
            <h1 class="title">Morning</h1>

            <!-- Ribbon Graphic (Inline SVG) -->
            <svg class="ribbon-svg" viewBox="0 0 300 80" preserveAspectRatio="none">
                <!-- Drop shadow definition for ribbon -->
                <defs>
                    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#d1b8b8" />
                        <stop offset="40%" stop-color="#b69595" />
                        <stop offset="60%" stop-color="#a88585" />
                        <stop offset="100%" stop-color="#d1b8b8" />
                    </linearGradient>
                    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
                    </filter>
                </defs>
                <!-- Wavy Ribbon Path -->
                <path d="M -10,60 C 100,80 150,20 310,40 L 310,60 C 150,40 100,100 -10,80 Z" 
                      fill="url(#ribbon-grad)" 
                      filter="url(#shadow)"/>
                <path d="M -10,50 C 100,70 150,10 310,30 L 310,40 C 150,20 100,80 -10,60 Z" 
                      fill="#cdb1b1" 
                      opacity="0.5"/>
            </svg>

            <!-- Looping Line Graphic (Inline SVG) -->
            <svg class="loop-line-svg" viewBox="0 0 200 80">
                <path d="M 10,70 
                         C 40,50 50,30 40,40 
                         C 30,50 20,60 40,65 
                         C 60,70 120,50 190,20" 
                      fill="transparent" 
                      stroke="#6e6861" 
                      stroke-width="3.5" 
                      stroke-linecap="round"/>
            </svg>

        </div>
    </div>

</body>
</html>
