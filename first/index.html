<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SignalScope</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --real-color: #059669;
            --real-bg: #ecfdf5;
            --real-border: #a7f3d0;
            --ai-color: #e11d48;
            --ai-bg: #fff1f2;
            --ai-border: #fecdd3;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-400: #94a3b8;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-900: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: var(--gray-900);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 16px 60px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(15, 23, 42, 0.04);
            padding: 36px 32px;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 28px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--gray-900);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 15px;
            color: var(--gray-600);
            line-height: 1.5;
        }

        /* UPLOAD DROPZONE */
        .upload-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--gray-400);
            border-radius: 16px;
            padding: 32px 20px;
            cursor: pointer;
            background: var(--gray-50);
            transition: all 0.2s ease-in-out;
            margin-bottom: 20px;
        }

        .upload-box:hover,
        .upload-box.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            stroke: var(--gray-400);
            margin-bottom: 12px;
            transition: stroke 0.2s ease;
        }

        .upload-box:hover .upload-icon,
        .upload-box.dragover .upload-icon {
            stroke: var(--primary);
        }

        .upload-primary-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 4px;
        }

        .upload-sub-text {
            font-size: 13px;
            color: var(--gray-400);
        }

        input[type="file"] {
            display: none;
        }

        /* PREVIEW WRAPPER */
        .preview-wrapper {
            display: none;
            margin-bottom: 20px;
            position: relative;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 12px;
        }

        #preview {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        .file-info {
            margin-top: 10px;
            font-size: 13px;
            color: var(--gray-600);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            background: var(--gray-400);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* LOADING SPINNER */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* RESULT CARD */
        #result {
            display: none;
            margin-top: 24px;
            padding: 24px;
            border-radius: 16px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            text-align: left;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--gray-200);
        }

        .verdict-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .verdict-tag.real {
            background: var(--real-bg);
            color: var(--real-color);
            border: 1px solid var(--real-border);
        }

        .verdict-tag.ai {
            background: var(--ai-bg);
            color: var(--ai-color);
            border: 1px solid var(--ai-border);
        }

        .confidence-label {
            font-size: 13px;
            color: var(--gray-600);
            font-weight: 500;
        }

        .confidence-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--gray-900);
            text-align: right;
        }

        /* METERS */
        .meters-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .meter-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meter-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray-700);
        }

        .meter-bar-track {
            width: 100%;
            height: 10px;
            background: var(--gray-200);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .meter-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .meter-bar-fill.ai {
            background: linear-gradient(90deg, #fb7185 0%, #e11d48 100%);
        }

        .meter-bar-fill.real {
            background: linear-gradient(90deg, #34d399 0%, #059669 100%);
        }

        /* ERROR TOAST */
        .error-message {
            display: none;
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 14px;
            text-align: left;
        }
    </style>

</head>


<body>

<div class="container">

    <div class="header">
        <div class="badge-pill">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4"></path>
                <path d="M12 8h.01"></path>
            </svg>
            EfficientNet-B0 · CIFAKE
        </div>
        <h1>SignalScope</h1>
        <p class="subtitle">
            Upload an image to detect whether it is a real photograph or AI-generated.
        </p>
    </div>

    <!-- DROPZONE -->
    <label class="upload-box" id="dropzone">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span class="upload-primary-text">Click or drag image here</span>
        <span class="upload-sub-text">PNG, JPG, JPEG, WEBP</span>
        <input type="file" id="imageInput" accept="image/*">
    </label>

    <!-- PREVIEW WRAPPER -->
    <div class="preview-wrapper" id="previewWrapper">
        <img id="preview" alt="Selected Preview">
        <div class="file-info" id="fileInfo"></div>
    </div>

    <!-- SUBMIT BUTTON -->
    <button id="predictButton" class="btn" onclick="predictImage()">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Analyze Image</span>
    </button>

    <!-- ERROR NOTIFICATION -->
    <div id="errorMessage" class="error-message"></div>

    <!-- RESULT PANEL -->
    <div id="result">
        <div class="result-header">
            <div>
                <div style="font-size: 12px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px;">Classification</div>
                <div id="verdictTag" class="verdict-tag real">
                    <span id="verdictIcon"></span>
                    <span id="verdictText">REAL</span>
                </div>
            </div>
            <div>
                <div class="confidence-label">Confidence</div>
                <div class="confidence-value" id="confidenceValue">0%</div>
            </div>
        </div>

        <div class="meters-container">
            <!-- AI PROBABILITY -->
            <div class="meter-item">
                <div class="meter-header">
                    <span>AI Generated</span>
                    <span id="aiProbabilityText">0%</span>
                </div>
                <div class="meter-bar-track">
                    <div id="aiBarFill" class="meter-bar-fill ai"></div>
                </div>
            </div>

            <!-- REAL PROBABILITY -->
            <div class="meter-item">
                <div class="meter-header">
                    <span>Real Photograph</span>
                    <span id="realProbabilityText">0%</span>
                </div>
                <div class="meter-bar-track">
                    <div id="realBarFill" class="meter-bar-fill real"></div>
                </div>
            </div>
        </div>
    </div>

</div>


<script>
    const imageInput = document.getElementById("imageInput");
    const dropzone = document.getElementById("dropzone");
    const previewWrapper = document.getElementById("previewWrapper");
    const preview = document.getElementById("preview");
    const fileInfo = document.getElementById("fileInfo");
    const predictButton = document.getElementById("predictButton");
    const btnText = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");
    const resultBox = document.getElementById("result");
    const errorMessage = document.getElementById("errorMessage");

    // DRAG & DROP HIGHLIGHT
    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove('dragover');
        }, false);
    });

    dropzone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        if (dt.files && dt.files[0]) {
            imageInput.files = dt.files;
            handleFileSelect(dt.files[0]);
        }
    });

    imageInput.addEventListener("change", function () {
        if (this.files && this.files[0]) {
            handleFileSelect(this.files[0]);
        }
    });

    function handleFileSelect(file) {
        hideError();
        resultBox.style.display = "none";

        const reader = new FileReader();
        reader.onload = function (e) {
            preview.src = e.target.result;
            previewWrapper.style.display = "block";
            fileInfo.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                ${file.name} (${(file.size / 1024).toFixed(1)} KB)
            `;
        };
        reader.readAsDataURL(file);
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = "block";
    }

    function hideError() {
        errorMessage.style.display = "none";
    }

    async function predictImage() {
        const file = imageInput.files[0];
        if (!file) {
            showError("Please select or drop an image first.");
            return;
        }

        hideError();
        resultBox.style.display = "none";

        // Set Loading State
        predictButton.disabled = true;
        spinner.style.display = "inline-block";
        btnText.textContent = "Analyzing with SignalScope...";

        const formData = new FormData();
        formData.append("file", file);

        try {
            const apiUrl = window.location.protocol === "file:"
                ? "http://127.0.0.1:8000/predict"
                : "/predict";

            const response = await fetch(apiUrl, {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Server returned HTTP ${response.status}`);
            }

            const data = await response.json();

            if (!data.success) {
                showError("Detection failed: " + (data.error || "Unknown error"));
                return;
            }

            // Populate Results
            const isAI = data.prediction === "AI GENERATED";
            const verdictTag = document.getElementById("verdictTag");
            const verdictIcon = document.getElementById("verdictIcon");
            const verdictText = document.getElementById("verdictText");

            verdictText.textContent = data.prediction;
            if (isAI) {
                verdictTag.className = "verdict-tag ai";
                verdictIcon.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                        <circle cx="12" cy="5" r="2"></circle>
                        <path d="M12 7v4"></path>
                        <line x1="8" y1="16" x2="8" y2="16"></line>
                        <line x1="16" y1="16" x2="16" y2="16"></line>
                    </svg>
                `;
            } else {
                verdictTag.className = "verdict-tag real";
                verdictIcon.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                `;
            }

            document.getElementById("confidenceValue").textContent = data.confidence + "%";

            // Meters
            document.getElementById("aiProbabilityText").textContent = data.ai_probability + "%";
            document.getElementById("realProbabilityText").textContent = data.real_probability + "%";

            resultBox.style.display = "block";

            // Trigger smooth CSS animation for progress bars
            setTimeout(() => {
                document.getElementById("aiBarFill").style.width = Math.min(Math.max(data.ai_probability, 0), 100) + "%";
                document.getElementById("realBarFill").style.width = Math.min(Math.max(data.real_probability, 0), 100) + "%";
            }, 50);

        } catch (error) {
            showError("Could not connect to FastAPI server. Ensure uvicorn is running on http://127.0.0.1:8000.");
            console.error(error);
        } finally {
            predictButton.disabled = false;
            spinner.style.display = "none";
            btnText.textContent = "Analyze Image";
        }
    }
</script>

</body>

</html>
